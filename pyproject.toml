[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msp-bonds-mcp"
version = "0.4.0"
description = "Local stdio MCP server with independently packaged project components"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["msp_bonds_mcp*"]
