[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msp-bonds-vtb-reports"
version = "0.1.0"
description = "Read-only local inventory and format checks for VTB reports"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["msp_bonds_vtb_reports*"]
