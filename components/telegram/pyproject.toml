[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msp-bonds-telegram"
version = "0.1.0"
description = "Independent, fixed-destination Telegram notifications for MSP Bonds MCP"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<27"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["msp_bonds_telegram*"]
